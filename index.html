<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestió CEIP Cabanes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#EEF0E6;
    --surface:#FFFFFF;
    --surface-alt:#E3E7D8;
    --ink:#202B21;
    --ink-soft:#5B6355;
    --ink-faint:#8A9282;
    --line:#D6DBC7;
    --accent:#6893D3;
    --accent-strong:#4F74B0;
    --accent-ink:#16233D;
    --status-available-bg:#E1EEDA;
    --status-available-fg:#2C6B39;
    --status-loaned-bg:#F1E3EA;
    --status-loaned-fg:#743A57;
    --danger:#A6432E;
    --shadow: 0 1px 2px rgba(32,43,33,0.06), 0 4px 14px rgba(32,43,33,0.06);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#161C15; --surface:#1F2620; --surface-alt:#252D26;
      --ink:#ECEFE6; --ink-soft:#AEB8A5; --ink-faint:#7C8574; --line:#333D31;
      --accent:#8FB0E0; --accent-strong:#A9C3EA; --accent-ink:#10203D;
      --status-available-bg:#213829; --status-available-fg:#8FD3A0;
      --status-loaned-bg:#3A2530; --status-loaned-fg:#E3A9C3;
      --danger:#E3806B;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Public Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background: var(--accent); color: var(--accent-ink); }
  a{ color:inherit; } button{ font-family:inherit; } input, select{ font-family:inherit; }

  .app{ max-width:1180px; margin:0 auto; padding:0 20px 64px; }

  header.top{
    position:sticky; top:0; z-index:20; background:var(--bg);
    padding:22px 0 14px; border-bottom:1px solid var(--line); margin-bottom:22px;
  }
  .top-row{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand-logo{ height:46px; width:auto; flex-shrink:0; }
  h1{
    font-family:"Fraunces", Georgia, serif; font-optical-sizing:auto; font-weight:600;
    font-size:clamp(24px, 3vw, 32px); margin:0; letter-spacing:-0.01em; text-wrap:balance;
  }
  .subtitle{ margin:2px 0 0; color:var(--ink-soft); font-size:14px; }
  .whoami{ font-size:13px; color:var(--ink-soft); margin-top:4px; }
  .whoami button{ background:none; border:none; color:var(--accent-strong); font-weight:600; cursor:pointer; padding:0; font-size:13px; }

  .top-actions{ display:flex; gap:10px; flex-wrap:wrap; }

  .btn{
    display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:10px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    font-size:14px; font-weight:600; cursor:pointer;
    transition:border-color .15s ease, transform .1s ease, background .15s ease;
  }
  .btn:hover{ border-color:var(--ink-faint); }
  .btn:active{ transform:translateY(1px); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn-ghost{ background:transparent; border-color:transparent; padding:9px 10px; }
  .btn-ghost:hover{ background:var(--surface-alt); }
  .btn-danger{ color:var(--danger); }
  .btn-sm{ padding:6px 11px; font-size:13px; border-radius:8px; }
  .btn-block{ width:100%; justify-content:center; }

  .filters{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .filters select, .filters input[type="search"]{
    padding:8px 12px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:13.5px; min-width:150px;
  }
  .filters input[type="search"]{ min-width:200px; }
  .filters select:focus-visible, .filters input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .filter-count{ font-size:13px; color:var(--ink-faint); margin-left:2px; font-variant-numeric:tabular-nums; }

  .banner{
    display:flex; align-items:center; gap:10px; background:var(--status-loaned-bg); color:var(--status-loaned-fg);
    border-radius:10px; padding:11px 15px; font-size:13.5px; margin-bottom:18px;
  }

  .empty{ text-align:center; padding:70px 20px; color:var(--ink-soft); }
  .empty .glyph{ font-size:38px; margin-bottom:10px; opacity:.7; }
  .empty h2{ font-family:"Fraunces", serif; font-weight:600; font-size:20px; margin:0 0 6px; color:var(--ink); }
  .empty p{ margin:0 0 16px; font-size:14px; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(268px, 1fr)); gap:16px; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:11px;
    overflow:hidden;
  }
  .card-cover{
    display:block; width:calc(100% + 32px); margin:-16px -16px 0; height:128px;
    object-fit:cover; background:var(--surface-alt);
  }
  .card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .card-title{ font-family:"Fraunces", serif; font-weight:600; font-size:17px; margin:0; text-wrap:balance; line-height:1.25; }
  .pill{ flex-shrink:0; font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:99px; white-space:nowrap; }
  .pill-available{ background:var(--status-available-bg); color:var(--status-available-fg); }
  .pill-loaned{ background:var(--status-loaned-bg); color:var(--status-loaned-fg); }

  .tags{ display:flex; flex-wrap:wrap; gap:6px; }
  .tag{
    font-size:11.5px; letter-spacing:.02em; text-transform:uppercase; color:var(--ink-soft);
    background:var(--surface-alt); border-radius:6px; padding:3px 7px; font-weight:600;
  }
  .tag-materia{ color:var(--accent-strong); }
  .tag-code{ font-family:"IBM Plex Mono", monospace; text-transform:none; letter-spacing:0; }

  .loan-info{ font-size:12.5px; color:var(--ink-soft); font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums; }
  .loan-info b{ color:var(--ink); font-weight:600; font-family:"Public Sans", sans-serif; }

  .card-foot{ display:flex; gap:8px; margin-top:auto; padding-top:2px; }
  .card-foot .btn{ flex:1; justify-content:center; }
  .card-note{
    flex:1; margin:0; padding:9px 4px; text-align:center; font-size:12.5px;
    color:var(--ink-faint); font-style:italic;
  }

  .loan-form{ display:flex; flex-direction:column; gap:8px; background:var(--surface-alt); border-radius:10px; padding:10px; }
  .loan-form .row{ display:flex; gap:8px; }
  .loan-form .row .btn{ flex:1; justify-content:center; }

  .card-manage{ display:flex; gap:6px; justify-content:space-between; align-items:center; }
  .card-manage-right{ display:flex; gap:6px; }
  .icon-btn{
    background:transparent; border:none; color:var(--ink-faint); cursor:pointer;
    padding:4px; border-radius:6px; display:flex; align-items:center;
  }
  .icon-btn:hover{ color:var(--ink); background:var(--surface-alt); }
  .icon-btn svg{ width:15px; height:15px; }

  .incidents{ display:flex; flex-direction:column; gap:5px; }
  .incident-item{
    display:flex; align-items:center; gap:5px; background:var(--status-loaned-bg);
    color:var(--status-loaned-fg); border-radius:8px; padding:6px 9px; font-size:12.5px;
  }
  .incident-by{ color:var(--ink-faint); font-style:italic; }
  .incident-resolve{ margin-left:auto; color:var(--status-loaned-fg); }
  .incident-resolve:hover{ color:var(--ink); }

  .issue-list{ display:flex; flex-direction:column; gap:8px; }

  .overlay{
    position:fixed; inset:0; background:rgba(20,26,19,0.45);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:100;
  }
  .modal{
    background:var(--surface); border-radius:16px; padding:24px; width:100%; max-width:440px;
    max-height:86vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.25);
  }
  .modal h2{ font-family:"Fraunces", serif; font-weight:600; font-size:20px; margin:0 0 4px; }
  .modal .hint{ color:var(--ink-soft); font-size:13px; margin:0 0 18px; }
  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
  .field > label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; }
  .field input{ padding:9px 11px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:14px; }
  .field input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .field .help{ font-size:12px; color:var(--ink-faint); }
  .curso-options{ display:flex; flex-wrap:wrap; gap:7px; }
  .curso-chip{
    display:inline-flex; align-items:center; gap:6px; padding:7px 11px; border-radius:99px;
    border:1px solid var(--line); background:var(--surface); font-size:13px; cursor:pointer;
    user-select:none;
  }
  .curso-chip:has(input:checked){ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .curso-chip input{ margin:0; }
  .image-field{ display:flex; align-items:center; gap:12px; }
  .image-preview{
    width:64px; height:64px; flex-shrink:0; border-radius:10px; overflow:hidden;
    background:var(--surface-alt); display:flex; align-items:center; justify-content:center;
    font-size:22px; border:1px solid var(--line);
  }
  .image-preview img{ width:100%; height:100%; object-fit:cover; }
  .image-actions{ display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
  .image-actions input[type="file"]{ font-size:12.5px; max-width:200px; color:var(--ink-soft); }
  .modal-actions{ display:flex; gap:9px; margin-top:18px; }
  .modal-actions .btn{ flex:1; justify-content:center; }

  .teacher-list{ display:flex; flex-direction:column; gap:6px; margin:14px 0; max-height:260px; overflow-y:auto; }
  .teacher-row{ display:flex; align-items:center; justify-content:space-between; padding:7px 10px; border-radius:8px; background:var(--surface-alt); font-size:13.5px; }
  .add-teacher-row{ display:flex; gap:8px; }
  .add-teacher-row input{ flex:1; }

  /* Full-screen gates: PIN + who-are-you */
  .gate{
    position:fixed; inset:0; background:var(--bg); z-index:200;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .gate-card{ width:100%; max-width:380px; text-align:center; }
  .gate-card .glyph{ font-size:40px; margin-bottom:14px; }
  .gate-card h1{ font-size:24px; margin-bottom:6px; }
  .gate-card p{ color:var(--ink-soft); font-size:14px; margin:0 0 22px; }
  .gate-card input[type="password"], .gate-card input[type="text"]{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:16px; text-align:center;
    letter-spacing:.05em; margin-bottom:12px;
  }
  .gate-card input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .gate-error{ color:var(--danger); font-size:13px; min-height:18px; margin-bottom:6px; }
  .pick-list{ margin-bottom:6px; }
  .pick-list select{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:16px; text-align:center;
  }
  .pick-list select:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  /* Scanner */
  .scan-modal .modal{ max-width:400px; }
  #reader{ width:100%; border-radius:12px; overflow:hidden; margin-bottom:12px; background:var(--surface-alt); min-height:220px; }
  .scan-fallback{ display:flex; gap:8px; margin-top:10px; }
  .scan-fallback input{ flex:1; padding:9px 11px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:14px; }
  .scan-result-card{ background:var(--surface-alt); border-radius:10px; padding:14px; margin-top:12px; }
  .scan-result-card h3{ font-family:"Fraunces", serif; margin:0 0 4px; font-size:17px; }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>

function splitTags(raw){
  return raw.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
}
function uniqueSorted(list){
  var seen = {}, out = [];
  list.forEach(function(v){
    var key = v.toLowerCase();
    if(!seen[key]){ seen[key]=true; out.push(v); }
  });
  out.sort(function(a,b){ return a.localeCompare(b, "es"); });
  return out;
}

/* ---------------- Catalogue rendering ---------------- */
function populateFilterOptions(){
  var cursos = uniqueSorted(games.reduce(function(acc,g){ return acc.concat(g.cursos||[]); }, []));
  var materias = uniqueSorted(games.reduce(function(acc,g){ return acc.concat(g.materias||[]); }, []));
  var cursoSel = document.getElementById("f-curso");
  var materiaSel = document.getElementById("f-materia");
  var curCurso = filters.curso, curMateria = filters.materia;
  cursoSel.innerHTML = '<option value="">Todos los cursos</option>' +
    cursos.map(function(c){ return '<option value="'+esc(c)+'"'+(c===curCurso?" selected":"")+'>'+esc(c)+'</option>'; }).join("");
  materiaSel.innerHTML = '<option value="">Todas las materias</option>' +
    materias.map(function(m){ return '<option value="'+esc(m)+'"'+(m===curMateria?" selected":"")+'>'+esc(m)+'</option>'; }).join("");
}
function matchesFilters(g){
  if(filters.curso && (g.cursos||[]).indexOf(filters.curso) === -1) return false;
  if(filters.materia && (g.materias||[]).indexOf(filters.materia) === -1) return false;
  if(filters.estado && g.estado !== filters.estado) return false;
  if(filters.q){
    var q = filters.q.toLowerCase();
    if((g.nombre||"").toLowerCase().indexOf(q) === -1) return false;
  }
  return true;
}

function resizeImageFile(file, maxWidth, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxWidth / img.width);
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = function(){ reject(new Error("No se pudo leer la imagen")); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ reject(new Error("No se pudo leer el archivo")); };
    reader.readAsDataURL(file);
  });
}
function handleImageFileChange(e){
  var file = e.target.files && e.target.files[0];
  if(!file) return;
  var preview = document.getElementById("g-imagen-preview");
  preview.innerHTML = "…";
  resizeImageFile(file, 400, 0.7).then(function(dataUrl){
    modalImageData = dataUrl;
    preview.innerHTML = '<img src="'+dataUrl+'" alt="">';
    document.getElementById("g-imagen-remove").style.display = "";
  }).catch(function(){
    preview.innerHTML = "🎲";
  });
}

/* ---------------- Scanner ---------------- */
function openScan(){
  scanFoundGame = null;
  scanning = true;
  renderScan();
  startCamera();
}
function closeScan(){
  scanning = false;
  scanFoundGame = null;
  stopCamera();
  scanSlot.innerHTML = "";
}
function startCamera(){
  if(typeof Html5Qrcode === "undefined"){ showScanFallbackOnly("La librería de escaneo no se cargó (sin conexión a internet?)."); return; }
  html5QrCode = new Html5Qrcode("reader");
  cameraRunning = false;
  html5QrCode.start(
    { facingMode: { ideal: "environment" } },
    {
      fps: 10,
      qrbox: { width: 280, height: 140 },
      videoConstraints: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
    },
    function(decodedText){ handleScanResult(decodedText); },
    function(){ /* ignore per-frame no-match */ }
  ).then(function(){ cameraRunning = true; })
   .catch(function(err){
     cameraRunning = false;
     showScanFallbackOnly((err && (err.message || err)) || "Error desconocido al iniciar la cámara.");
   });
}
function stopCamera(){
  if(html5QrCode && cameraRunning){
    cameraRunning = false;
    html5QrCode.stop().catch(function(){}).then(function(){
      if(html5QrCode){ try{ html5QrCode.clear(); }catch(e){} }
      html5QrCode = null;
    });
  } else {
    html5QrCode = null;
  }
}
function showScanFallbackOnly(reason){
  var reader = document.getElementById("reader");
  if(reader) reader.innerHTML =
    '<div class="hint" style="padding:16px;">No se pudo acceder a la cámara en este dispositivo. Escribe el código a mano abajo.' +
    (reason ? '<br><br><span style="font-family:\'IBM Plex Mono\',monospace; font-size:11px;">Motivo: '+esc(String(reason))+'</span>' : '') +
    '</div>';
}
function handleScanResult(code){
  stopCamera();
  var found = games.find(function(g){ return g.codigo && g.codigo === code; });
  scanFoundGame = found || null;
  renderScan(code, !found);
}
function renderScan(lastCode, notFound){
  if(!scanning){ scanSlot.innerHTML = ""; return; }
  var resultHtml = "";
  if(scanFoundGame){
    var g = scanFoundGame;
    var isLoaned = g.estado === "prestado";
    resultHtml =
      '<div class="scan-result-card">' +
        '<h3>'+esc(g.nombre)+'</h3>' +
        (isLoaned
          ? '<p class="hint">Prestado a '+esc(g.prestadoA||"—")+' desde '+esc(fmtDate(g.fechaPrestamo))+'</p>' +
            (g.prestadoA === currentTeacher() || isAdmin()
              ? '<button class="btn btn-primary btn-block" data-action="scan-return" data-id="'+esc(g.id)+'" type="button">Marcar como devuelto</button>'
              : '<p class="card-note">Solo '+esc(g.prestadoA||"quien lo tiene")+' puede marcarlo como devuelto.</p>')
          : '<button class="btn btn-primary btn-block" data-action="scan-loan" data-id="'+esc(g.id)+'" type="button">Prestarme "'+esc(g.nombre)+'"</button>'
        ) +
      '</div>';
  } else if(notFound){
    resultHtml = '<div class="scan-result-card"><p class="hint">No hay ningún juego con el código <b>'+esc(lastCode)+'</b>. Puedes añadirlo desde "+ Añadir juego".</p></div>';
  }
  scanSlot.innerHTML =
    '<div class="overlay scan-modal" id="scan-overlay"><div class="modal">' +
      '<h2>Escanear código</h2>' +
      '<p class="hint">Apunta con la cámara al código de barras del juego.</p>' +
      '<div id="reader"></div>' +
      resultHtml +
      '<div class="scan-fallback">' +
        '<input type="text" id="scan-manual" placeholder="O escribe el código a mano">' +
        '<button class="btn btn-sm" id="scan-manual-btn" type="button">Buscar</button>' +
      '</div>' +
      '<div class="modal-actions"><button class="btn" id="scan-close" type="button">Cerrar</button></div>' +
    '</div></div>';
  document.getElementById("scan-close").addEventListener("click", closeScan);
  document.getElementById("scan-manual-btn").addEventListener("click", function(){
    var v = document.getElementById("scan-manual").value.trim();
    if(v) handleScanResult(v);
  });
}

/* ---------------- Events ---------------- */
gridSlot.addEventListener("click", function(e){
  var btn = e.target.closest("[data-action]");
  if(!btn) return;
  var action = btn.getAttribute("data-action");
  var id = btn.getAttribute("data-id");
  if(action === "start-loan"){ loaningId = id; render(); }
  else if(action === "cancel-loan"){ loaningId = null; render(); }
  else if(action === "confirm-loan"){
    var card = btn.closest(".card");
    var sel = card.querySelector('[data-role="loan-select"]');
    var name = sel && sel.value;
    if(!name) return;
    markLoan(id, name);
    loaningId = null;
  }
  else if(action === "return"){ markReturn(id); }
  else if(action === "edit"){
    var game = games.find(function(g){ return g.id === id; });
    if(game) openGameModal("edit", game);
  }
  else if(action === "delete"){
    var game2 = games.find(function(g){ return g.id === id; });
    if(game2 && confirm('¿Eliminar "'+game2.nombre+'" de la ludoteca?')) deleteDoc(doc(db, "games", id));
  }
  else if(action === "report-issue"){
    var game3 = games.find(function(g){ return g.id === id; });
    if(game3) openReportModal(game3);
  }
  else if(action === "resolve-incident"){
    var idx = parseInt(btn.getAttribute("data-index"), 10);
    var game4 = games.find(function(g){ return g.id === id; });
    if(game4 && game4.incidencias && game4.incidencias[idx]) resolveIncident(id, game4.incidencias[idx]);
  }
});
modalSlot.addEventListener("click", function(e){
  var btn = e.target.closest("[data-action]");
  if(!btn) return;
  if(btn.getAttribute("data-action") === "remove-teacher") removeTeacher(btn.getAttribute("data-name"));
});
scanSlot.addEventListener("click", function(e){
  var btn = e.target.closest("[data-action]");
  if(!btn) return;
  var action = btn.getAttribute("data-action");
  var id = btn.getAttribute("data-id");
  if(action === "scan-loan"){ markLoan(id, currentTeacher()); closeScan(); }
  else if(action === "scan-return"){ markReturn(id); closeScan(); }
});

document.getElementById("btn-add-game").addEventListener("click", function(){ openGameModal("add"); });
document.getElementById("btn-teachers").addEventListener("click", function(){ modalMode = "teachers"; renderModal(); });
document.getElementById("btn-scan").addEventListener("click", openScan);
document.getElementById("f-curso").addEventListener("change", function(e){ filters.curso = e.target.value; render(); });
document.getElementById("f-materia").addEventListener("change", function(e){ filters.materia = e.target.value; render(); });
document.getElementById("f-estado").addEventListener("change", function(e){ filters.estado = e.target.value; render(); });
document.getElementById("f-q").addEventListener("input", function(e){ filters.q = e.target.value; render(); });

/* ---------------- Data listeners ---------------- */
function startDataListeners(){
  onSnapshot(gamesCol, function(snap){
    games = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    render();
  }, function(){
    bannerSlot.innerHTML = '<div class="banner">No se pudo conectar con la base de datos. Revisa la configuración de Firebase en el archivo.</div>';
  });
  onSnapshot(teachersRef, function(snap){
    var data = snap.exists() ? snap.data() : null;
    teachers = (data && Array.isArray(data.names)) ? data.names.slice().sort(function(a,b){ return a.localeCompare(b,"ca"); }) : [];
    render();
    if(!currentTeacher()) renderPickList();
    if(modalMode === "teachers") renderModal();
  }, function(){});
}

renderPinGate();
</script>
